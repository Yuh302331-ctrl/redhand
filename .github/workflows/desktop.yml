name: Desktop packages

on:
  push:
    branches: ['release/desktop-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
          - target: windows-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Yuh302331-ctrl/agenttrueup
          ref: 617569d18270cbdbc76a6660789b7a5c84b613b3
          path: agenttrueup-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux graphical test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libx11-6 libxft2 libxss1 fonts-noto-cjk
      - name: Install the packager
        run: python -m pip install pyinstaller==6.22.3
      - name: Build and exercise the packaged application
        run: python desktop/package.py agenttrueup-source desktop-work release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
