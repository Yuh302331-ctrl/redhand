[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redhand"
version = "0.2.0"
description = "Catch file changes red-handed: a cross-agent change journal that answers 'who edited this file?' and puts it back if needed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yuh302331-ctrl" }]
keywords = [
  "file-watch",
  "audit",
  "journal",
  "ai-agents",
  "claude-code",
  "codex",
  "undo",
  "attribution",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Filesystems",
  "Topic :: System :: Logging",
  "Topic :: Utilities",
]
# Zero runtime dependencies — stdlib only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
redhand = "redhand.cli:main"

[project.urls]
Homepage = "https://github.com/Yuh302331-ctrl/redhand"
Issues = "https://github.com/Yuh302331-ctrl/redhand/issues"
Changelog = "https://github.com/Yuh302331-ctrl/redhand/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["redhand"]
